services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      NODE_ENV: production
      PORT: "${PORT:-3000}"
      SUPABASE_URL: "${SUPABASE_URL}"
      SUPABASE_SERVICE_KEY: "${SUPABASE_SERVICE_KEY}"
      DASHBOARD_PASSWORD: "${DASHBOARD_PASSWORD}"
      SESSION_SECRET: "${SESSION_SECRET}"
    expose:
      - "3000"